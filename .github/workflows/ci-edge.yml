name: Career Intelligence Edge API Tests
on:
  push:
    paths:
      - 'supabase/functions/ci-api/**'
      - 'supabase/migrations/0010_workspace_owners.sql'
      - '.github/workflows/ci-edge.yml'
  pull_request:
    paths:
      - 'supabase/functions/ci-api/**'
      - 'supabase/migrations/0010_workspace_owners.sql'
      - '.github/workflows/ci-edge.yml'
permissions:
  contents: read
jobs:
  test-edge-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test supabase/functions/ci-api/policy.test.mjs
