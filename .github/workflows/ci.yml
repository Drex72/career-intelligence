name: Offline Python Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker and tests
        run: python -m pip install -e 'services/worker[test]'
      - name: Run offline contract, unit and local integration tests
        run: python -m pytest services/worker/tests -q
