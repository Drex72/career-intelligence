name: Python and PostgreSQL Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker and tests
        run: python -m pip install -e 'services/worker[test]'
      - name: Run offline contract, unit and local integration tests
        run: python -m pytest services/worker/tests -q
  oci-compose-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate both safe and active OCI worker configurations
        run: |
          cp deploy/oci/secrets.env.example deploy/oci/secrets.env
          chmod 600 deploy/oci/secrets.env
          docker compose -f deploy/oci/compose.yaml config --format json > /tmp/oci-dry.json
          docker compose -f deploy/oci/compose.yaml -f deploy/oci/compose.active.yaml config --format json > /tmp/oci-active.json
          python - <<'PY'
          import json
          expected={'discovery','eligibility','matching','people','outreach','conversation'}
          for phase,path in (('dry','/tmp/oci-dry.json'),('active','/tmp/oci-active.json')):
              data=json.load(open(path))
              assert set(data['services'])==expected
              for name,spec in data['services'].items():
                  env=spec['environment']
                  assert env['CI_SPECIALIST_ROLE']==name
                  assert env['CI_LANGGRAPH_ENABLED']==('false' if phase=='dry' else 'true')
                  assert spec.get('ports') is None
                  assert spec.get('privileged',False) is False
                  assert 'ALL' in spec.get('cap_drop',[])
                  assert 'ci-worker' in env['CI_WORKER_ENDPOINT']
                  assert not spec.get('networks',{}).get('host')
                  assert spec.get('mem_limit') is not None
                  if phase=='dry':
                      assert spec.get('command')==['--dry-run']
                  else:
                      assert spec.get('command') is None or spec.get('command')==[]
          print('OCI Compose safety and role separation checks passed.')
          PY
          rm -f deploy/oci/secrets.env
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: career_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d career_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_TEST_DSN: postgresql://postgres:postgres@localhost:5432/career_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker and PostgreSQL test driver
        run: python -m pip install -e 'services/worker[test,agents]'
      - name: Apply migrations to disposable database
        run: python -m pytest services/worker/tests/integration/test_postgres_migrations.py -v
      - name: Exercise PostgreSQL worker ledger
        run: python -m pytest services/worker/tests/system/test_postgres_ledger.py -v
      - name: Verify PostgreSQL company/job catalog and lifetime deliveries
        run: python -m pytest services/worker/tests/integration/test_postgres_catalog.py -v
      - name: Verify bounded manual Remotive ingestion and rate limits
        run: python -m pytest services/worker/tests/integration/test_postgres_manual_discovery.py -v
      - name: Verify lifetime company delivery and evidence-gated daily batches
        run: python -m pytest services/worker/tests/integration/test_postgres_daily_batch.py -v
      - name: Verify private ATS ingestion and eligibility-review queue
        run: python -m pytest services/worker/tests/integration/test_postgres_ats.py -v
      - name: Verify official ATS link candidates are safe, scoped and review-only
        run: python -m pytest services/worker/tests/integration/test_postgres_official_ats_candidates.py -v
      - name: Verify official ATS eligibility decisions and private evidence audit
        run: python -m pytest services/worker/tests/integration/test_postgres_official_review.py -v
      - name: Verify untrusted ATS candidate review and safe promotion
        run: python -m pytest services/worker/tests/integration/test_postgres_candidates.py -v
      - name: Verify stale eligibility requeue and official negative overrides
        run: python -m pytest services/worker/tests/integration/test_postgres_eligibility_refresh.py -v
      - name: Verify signed worker HMAC, replay controls and private secrets
        run: python -m pytest services/worker/tests/integration/test_postgres_signed_worker.py -v
      - name: Verify verified-job matching and people task handoff
        run: python -m pytest services/worker/tests/integration/test_postgres_verified_handoff.py -v
      - name: Verify daily Himalayas source attribution and private ingestion
        run: python -m pytest services/worker/tests/integration/test_postgres_himalayas.py -v
      - name: Audit production-style job provenance, eligibility and owner preferences
        run: python -m pytest services/worker/tests/integration/test_postgres_integrity_audit.py -v
      - name: Verify saved owner discovery preferences and evidence-required generation
        run: python -m pytest services/worker/tests/integration/test_postgres_discovery_preferences.py -v
      - name: Verify official ATS work mode and sponsorship evidence
        run: python -m pytest services/worker/tests/integration/test_postgres_work_facts.py -v
      - name: Verify source registry migration and board metadata
        run: python -m pytest services/worker/tests/integration/test_postgres_sources.py -v
      - name: Verify versioned private knowledge ingestion
        run: python -m pytest services/worker/tests/integration/test_postgres_knowledge.py -v
      - name: Verify knowledge-aware PostgreSQL role ranking
        run: python -m pytest services/worker/tests/integration/test_postgres_matching.py -v
      - name: Verify draft-only owner-gated PostgreSQL outreach
        run: python -m pytest services/worker/tests/integration/test_postgres_outreach.py -v
      - name: Verify reply intelligence and per-role evidence
        run: python -m pytest services/worker/tests/integration/test_postgres_conversation.py -v
      - name: Verify PostgreSQL outreach approvals and no-send intent ledger
        run: python -m pytest services/worker/tests/integration/test_postgres_outreach_authorization.py -v
      - name: Exercise six-role LangGraph routing and checkpoints
        run: python -m pytest services/worker/tests/integration/test_langgraph_runtime.py -v
      - name: Boot six separately hosted LangGraph worker runtimes in safe dry run
        run: python -m pytest services/worker/tests/integration/test_postgres_hosted_langgraph.py -v
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dashboard dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Run dashboard behavior tests
        working-directory: apps/web
        run: npm test
      - name: Check dashboard TypeScript
        working-directory: apps/web
        run: npm run typecheck
      - name: Build Next.js dashboard
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-test-key
          CI_BACKEND_URL: http://127.0.0.1:8000
        run: npm run build
