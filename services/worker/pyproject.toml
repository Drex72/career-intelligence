[project]
name = "career-intelligence-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.27,<1", "fastapi>=0.100,<1", "uvicorn>=0.20,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]
agents = ["langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4", "psycopg[binary]>=3,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
